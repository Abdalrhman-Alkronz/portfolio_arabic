<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معاينة أداة المحادثة</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #090d16;
      color: #edf5f2;
      font-family: "Cairo", Inter, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #9aa8a6; max-width: 420px; margin: 0 auto; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div>
    <h1>معاينة أداة المحادثة</h1>
    <p>هذه صفحة اختبار فارغة — يجب أن تظهر فقاعة المحادثة في الزاوية السفلية اليسرى وتبقى ثابتة أثناء التمرير.</p>
  </div>

  <script type="module" src="./ai-chat-widget.js"></script>

  <!--
    ⚠️ Replace the "api" value below with your real deployed Vercel URL
    once you finish the setup steps, e.g.:
    api="https://abdalrhman-chat-api.vercel.app/api/chat"

    The avatar attribute is OPTIONAL — the widget already has the
    photo built in. Only pass "avatar" if you want to override it.
  -->
  <abdalrhman-ai-chat api="https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app/api/chat"></abdalrhman-ai-chat>
</body>
</html>
